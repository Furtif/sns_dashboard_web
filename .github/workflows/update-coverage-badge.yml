name: Update Coverage Badge

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  update-badge:
    runs-on: ubuntu-latest
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22.x'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run tests with coverage
        run: npm run test:coverage

      - name: Extract coverage percentage
        id: coverage
        run: |
          # Extract the coverage percentage from the summary
          COVERAGE=$(grep -oP 'All files.*\|\s*\K[0-9.]+(?=\s*\|)' tests/coverage/lcov-report/index.html 2>/dev/null || echo "0")
          if [ "$COVERAGE" = "0" ] || [ -z "$COVERAGE" ]; then
            # Try alternative extraction from text report
            COVERAGE=$(npm run test:coverage 2>&1 | grep -oP 'All files.*\|\s*\K[0-9.]+(?=\s*\|)' | head -1 || echo "35")
          fi
          # Round to integer
          COVERAGE_ROUNDED=$(printf "%.0f" "$COVERAGE")
          echo "percentage=$COVERAGE_ROUNDED" >> $GITHUB_OUTPUT
          echo "Coverage: $COVERAGE_ROUNDED%"

      - name: Choose badge color
        id: badge
        run: |
          COVERAGE=${{ steps.coverage.outputs.percentage }}
          if [ $COVERAGE -ge 80 ]; then
            COLOR="brightgreen"
          elif [ $COVERAGE -ge 60 ]; then
            COLOR="green"
          elif [ $COVERAGE -ge 40 ]; then
            COLOR="yellow"
          elif [ $COVERAGE -ge 20 ]; then
            COLOR="orange"
          else
            COLOR="red"
          fi
          echo "color=$COLOR" >> $GITHUB_OUTPUT
          echo "Color: $COLOR"

      - name: Update README badge
        run: |
          COVERAGE=${{ steps.coverage.outputs.percentage }}
          COLOR=${{ steps.badge.outputs.color }}
          
          # Update the badge URL in README
          sed -i "s|https://img.shields.io/badge/coverage-[0-9]*%25-[a-z]*|https://img.shields.io/badge/coverage-${COVERAGE}%25-${COLOR}|g" README.md
          
          echo "Updated badge to ${COVERAGE}% (${COLOR})"

      - name: Check for changes
        id: changes
        run: |
          if git diff --quiet README.md; then
            echo "No changes to README"
            echo "changed=false" >> $GITHUB_OUTPUT
          else
            echo "README has changes"
            echo "changed=true" >> $GITHUB_OUTPUT
          fi

      - name: Commit and push changes
        if: steps.changes.outputs.changed == 'true'
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          git add README.md
          git commit -m "docs: update coverage badge to ${{ steps.coverage.outputs.percentage }}%"
          git push
