codecov:
  require_ci_to_pass: yes
  notify:
    wait_for_ci: yes

coverage:
  precision: 2
  round: down
  range: "70...100"
  status:
    project:
      default:
        target: auto
        threshold: 1%
        base: auto
        flags:
          - unittests
        paths:
          - "src"
        if_ci_failed: error
        informational: false
        only_pull_requests: false
    patch:
      default:
        target: auto
        threshold: 1%
        base: auto
        if_ci_failed: error
        informational: false
        only_pull_requests: false

comment:
  layout: "reach,diff,flags,files,footer"
  behavior: default
  require_changes: false
  require_base: false
  require_head: true
  hide_project_coverage: false

flags:
  unittests:
    carryforward: true
    paths:
      - src/

ignore:
  - "src/index.js"
  - "tests/**/*"
  - "node_modules/**/*"
  - "dist/**/*"
  - "public/**/*"
  - "scripts_history/**/*"
